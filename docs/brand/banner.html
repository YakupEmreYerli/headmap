<!doctype html>
<!-- Source of docs/banner.en.png and docs/banner.tr.png (1280×640). Render both: node tools/build-banner.mjs
     The panel on the right is the real popup (popup.html, popup.css, popup.js) reading a fixed copy of
     MDN's heading elements page; build-banner.mjs builds that page and passes it in as ?popup=<url>.
     ?lang=tr swaps in the Turkish text below. -->
<html lang="en"><head><meta charset="utf-8"><style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1280px;height:640px;overflow:hidden}
body{background:#f8f3e9;color:#33251c;font-family:'Noto Sans',sans-serif;-webkit-font-smoothing:antialiased;position:relative}
.icon{position:absolute;left:72px;top:121px;width:128px;height:128px}
.name{position:absolute;left:80px;top:271.0px;font-size:76px;font-weight:700;line-height:1;letter-spacing:-1.5px}
.sub{position:absolute;left:80px;top:365.0px;font-size:29.0px;line-height:39px;color:#5a4a3e;white-space:nowrap}
.rule{position:absolute;left:80px;top:469px;width:64px;height:6px;border-radius:3px;background:#c2562a}
.foot{position:absolute;left:80px;top:496px;font-size:20px;line-height:1;color:#6e5d50;letter-spacing:0.0px;white-space:nowrap}
.panel{position:absolute;left:719px;top:59px;width:482px;height:522px;border:1px solid #e2d7c3;border-radius:14px;background:#f8f3e9;overflow:hidden;
  box-shadow:0 24px 64px rgba(51,37,28,.22)}
.panel .clip{position:absolute;inset:0;overflow:hidden;-webkit-mask-image:linear-gradient(to bottom,#000 410.0px,transparent 500.0px);mask-image:linear-gradient(to bottom,#000 410.0px,transparent 500.0px)}
.panel iframe{border:0;width:540px;height:600px;transform:scale(0.8888888888888888);transform-origin:0 0;display:block}
</style></head><body>
<img class="icon" src="../../icons/src/icon.svg" alt="">
<div class="name">Headmap</div>
<div class="sub">Title, meta and the H1–H6 outline<br>of any page, at a glance.</div>
<div class="rule"></div>
<div class="foot">Brave · Chrome · Edge — free, open source</div>
<div class="panel"><div class="clip"><iframe scrolling="no"></iframe></div></div>
<script>
const tr = {
	sub: 'Bir sayfanın title, meta ve H1–H6<br>başlık ağacı tek bakışta.',
	foot: 'Brave · Chrome · Edge — ücretsiz, açık kaynak',
};
const query = new URLSearchParams(location.search);
if (query.get('lang') === 'tr') {
	document.documentElement.lang = 'tr';
	for (const [name, html] of Object.entries(tr)) document.querySelector('.' + name).innerHTML = html;
}
if (query.get('popup')) document.querySelector('iframe').src = query.get('popup');
</script>
</body></html>
